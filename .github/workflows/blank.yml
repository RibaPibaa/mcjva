
name: Build Garage Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract mod source
        run: |
          mkdir source
          unzip -q garage-mod-source.zip -d source

      - name: Build mod
        run: |
          WRAPPER=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: garageauction-jar
          path: source/**/build/libs/*.jar
